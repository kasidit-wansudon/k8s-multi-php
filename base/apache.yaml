# ═══════════════════════════════════════════════════════
#  Apache — Reverse Proxy แยก PHP version ตาม domain
#  mount โฟลเดอร์ apps/ จริงๆ จาก host
# ═══════════════════════════════════════════════════════

apiVersion: apps/v1
kind: Deployment
metadata:
  name: apache
  namespace: oway
  labels:
    app: apache
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apache
  template:
    metadata:
      labels:
        app: apache
    spec:
      containers:
        - name: apache
          image: httpd:2.4
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 665
            - containerPort: 666
          volumeMounts:
            - name: httpd-conf
              mountPath: /usr/local/apache2/conf/httpd.conf
              subPath: httpd.conf
            - name: site-zend2
              mountPath: /usr/local/apache2/conf/extra/sites/zend2.conf
              subPath: zend2.conf
            - name: site-laravel
              mountPath: /usr/local/apache2/conf/extra/sites/laravel.conf
              subPath: laravel.conf
            - name: zend2-code
              mountPath: /var/www/zend2        # ← mount โฟลเดอร์จริง
            - name: laravel-code
              mountPath: /var/www/laravel      # ← mount โฟลเดอร์จริง
            - name: ssl-cert
              mountPath: /etc/ssl/oway         # ← self-signed cert
              readOnly: true
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "250m"
      volumes:
        - name: httpd-conf
          configMap:
            name: apache-config
            items:
              - key: httpd.conf
                path: httpd.conf
        - name: site-zend2
          configMap:
            name: apache-config
            items:
              - key: zend2.conf
                path: zend2.conf
        - name: site-laravel
          configMap:
            name: apache-config
            items:
              - key: laravel.conf
                path: laravel.conf
        - name: zend2-code
          hostPath:
            path: /HOST_APPS/zend2            # ← จะถูก deploy.sh แทนค่า path จริง
            type: Directory
        - name: laravel-code
          hostPath:
            path: /HOST_APPS/laravel          # ← จะถูก deploy.sh แทนค่า path จริง
            type: Directory
        - name: ssl-cert
          secret:
            secretName: oway-tls

---
apiVersion: v1
kind: Service
metadata:
  name: apache
  namespace: oway
spec:
  selector:
    app: apache
  ports:
    - name: http
      port: 665
      targetPort: 665
      nodePort: 665
    - name: https
      port: 666
      targetPort: 666
      nodePort: 666
  type: NodePort
