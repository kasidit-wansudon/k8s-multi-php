# Secret — เก็บรหัสผ่าน MySQL/MariaDB
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: oway
type: Opaque
stringData:
  # MariaDB รองรับทั้ง MYSQL_ และ MARIADB_ prefix
  MYSQL_ROOT_PASSWORD: root_secret
  MYSQL_DATABASE: mex_sellin
  MYSQL_USER: oway
  MYSQL_PASSWORD: oway_secret
  MARIADB_ROOT_PASSWORD: root_secret
  MARIADB_DATABASE: mex_sellin
  MARIADB_USER: oway
  MARIADB_PASSWORD: oway_secret
