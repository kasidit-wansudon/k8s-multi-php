# ═══════════════════════════════════════════════════════
#  Redis — In-memory cache สำหรับ DB query results
#  PHP → Redis (hit <1ms) → ไม่ต้องยิง MySQL
# ═══════════════════════════════════════════════════════
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: oway
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
        - name: redis
          image: redis:7.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
          args:
            - redis-server
            - --maxmemory 128mb
            - --maxmemory-policy allkeys-lru   # ลบ key เก่าสุดเมื่อเต็ม
            - --save ""                         # ไม่ต้อง persist ลง disk (cache เท่านั้น)
          resources:
            requests:
              memory: "32Mi"
              cpu: "50m"
            limits:
              memory: "160Mi"
              cpu: "200m"

---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: oway
spec:
  selector:
    app: redis
  ports:
    - port: 6379
      targetPort: 6379
  type: ClusterIP
