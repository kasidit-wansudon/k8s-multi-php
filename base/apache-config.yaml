# ConfigMap — Apache httpd.conf + VirtualHost configs (HTTP + HTTPS)
apiVersion: v1
kind: ConfigMap
metadata:
  name: apache-config
  namespace: oway
data:
  httpd.conf: |
    ServerRoot "/usr/local/apache2"
    Listen 80
    Listen 443
    LoadModule mpm_event_module modules/mod_mpm_event.so
    LoadModule authn_core_module modules/mod_authn_core.so
    LoadModule authz_core_module modules/mod_authz_core.so
    LoadModule access_compat_module modules/mod_access_compat.so
    LoadModule reqtimeout_module modules/mod_reqtimeout.so
    LoadModule filter_module modules/mod_filter.so
    LoadModule mime_module modules/mod_mime.so
    LoadModule log_config_module modules/mod_log_config.so
    LoadModule env_module modules/mod_env.so
    LoadModule headers_module modules/mod_headers.so
    LoadModule setenvif_module modules/mod_setenvif.so
    LoadModule version_module modules/mod_version.so
    LoadModule unixd_module modules/mod_unixd.so
    LoadModule dir_module modules/mod_dir.so
    LoadModule alias_module modules/mod_alias.so
    LoadModule rewrite_module modules/mod_rewrite.so
    LoadModule proxy_module modules/mod_proxy.so
    LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
    LoadModule ssl_module modules/mod_ssl.so
    LoadModule socache_shmcb_module modules/mod_socache_shmcb.so
    ServerName localhost
    TypesConfig conf/mime.types
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
    Include conf/extra/sites/*.conf

  zend2.conf: |
    # HTTP → redirect to HTTPS
    <VirtualHost *:80>
        ServerName zend2.localhost
        RewriteEngine On
        RewriteRule ^(.*)$ https://zend2.localhost:30443$1 [R=301,L]
    </VirtualHost>

    # HTTPS
    <VirtualHost *:443>
        ServerName zend2.localhost
        DocumentRoot /var/www/zend2/public
        SSLEngine on
        SSLCertificateFile    /etc/ssl/oway/tls.crt
        SSLCertificateKeyFile /etc/ssl/oway/tls.key
        <Directory /var/www/zend2/public>
            AllowOverride All
            Require all granted
            DirectoryIndex index.php
        </Directory>
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://php74:9000"
        </FilesMatch>
    </VirtualHost>

  laravel.conf: |
    # HTTP → redirect to HTTPS
    <VirtualHost *:80>
        ServerName laravel.localhost
        RewriteEngine On
        RewriteRule ^(.*)$ https://laravel.localhost:30443$1 [R=301,L]
    </VirtualHost>

    # HTTPS
    <VirtualHost *:443>
        ServerName laravel.localhost
        DocumentRoot /var/www/laravel/public
        SSLEngine on
        SSLCertificateFile    /etc/ssl/oway/tls.crt
        SSLCertificateKeyFile /etc/ssl/oway/tls.key
        <Directory /var/www/laravel/public>
            AllowOverride All
            Require all granted
            DirectoryIndex index.php
        </Directory>
        <FilesMatch \.php$>
            SetHandler "proxy:fcgi://php84:9000"
        </FilesMatch>
    </VirtualHost>
