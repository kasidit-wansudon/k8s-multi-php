# ═══════════════════════════════════════════════════════
#  RBAC — ให้ PHP pod อ่านข้อมูล K8s ได้ (สำหรับ console page)
# ═══════════════════════════════════════════════════════

apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-reader
  namespace: oway

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-reader-role
  namespace: oway
rules:
  - apiGroups: [""]
    resources: ["pods", "nodes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list"]
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
  - apiGroups: ["metrics.k8s.io"]
    resources: ["pods", "nodes"]
    verbs: ["get", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-reader-binding
  namespace: oway
subjects:
  - kind: ServiceAccount
    name: k8s-reader
    namespace: oway
roleRef:
  kind: Role
  apiGroup: rbac.authorization.k8s.io
  name: k8s-reader-role
