# ═══════════════════════════════════════════════════════
#  Host Apache → K3s containers (Reverse Proxy)
#
#  ติดตั้ง:
#    sudo cp host-apache/k8s-proxy.conf /etc/httpd/conf.d/
#    sudo systemctl reload httpd
#
#  ต้องมี modules:
#    mod_proxy, mod_proxy_http, mod_ssl, mod_headers
#    RHEL/Amazon Linux มีอยู่แล้ว default
# ═══════════════════════════════════════════════════════

# ─── Option A: Path-based routing ──────────────────────
#   http://172.31.7.223/667  → phpMyAdmin
#   http://172.31.7.223/665  → container Apache HTTP
#   https://172.31.7.223/666 → container Apache HTTPS
#
#   ⚠️  ใช้ได้เฉพาะ phpMyAdmin — Laravel/Laminas จะพัง
#       เพราะ app generate absolute path `/css/...` ไม่ใช่ `/667/css/...`

# phpMyAdmin — ทำงานได้ปกติผ่าน path prefix
<Location /pma>
    ProxyPass        http://127.0.0.1:667
    ProxyPassReverse http://127.0.0.1:667
</Location>


# ─── Option B: Subdomain-based routing (แนะนำ) ─────────
#   http://zend2.172.31.7.223.nip.io   → Laminas
#   http://laravel.172.31.7.223.nip.io → Laravel
#   http://pma.172.31.7.223.nip.io     → phpMyAdmin
#
#   ใช้ nip.io = wildcard DNS → ไม่ต้องแก้ /etc/hosts
#   (หรือใช้ domain จริง ถ้ามี)

<VirtualHost *:80>
    ServerName zend2.172.31.7.223.nip.io
    ProxyPreserveHost Off
    ProxyPass        / https://127.0.0.1:666/
    ProxyPassReverse / https://127.0.0.1:666/
    RequestHeader set Host "zend2.localhost"
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    ErrorLog  /var/log/httpd/zend2-proxy-error.log
    CustomLog /var/log/httpd/zend2-proxy-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName laravel.172.31.7.223.nip.io
    ProxyPreserveHost Off
    ProxyPass        / https://127.0.0.1:666/
    ProxyPassReverse / https://127.0.0.1:666/
    RequestHeader set Host "laravel.localhost"
    SSLProxyEngine on
    SSLProxyVerify none
    SSLProxyCheckPeerCN off
    SSLProxyCheckPeerName off
    ErrorLog  /var/log/httpd/laravel-proxy-error.log
    CustomLog /var/log/httpd/laravel-proxy-access.log combined
</VirtualHost>

<VirtualHost *:80>
    ServerName pma.172.31.7.223.nip.io
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:667/
    ProxyPassReverse / http://127.0.0.1:667/
    ErrorLog  /var/log/httpd/pma-proxy-error.log
    CustomLog /var/log/httpd/pma-proxy-access.log combined
</VirtualHost>
